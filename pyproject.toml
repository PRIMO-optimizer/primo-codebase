[build-system]
requires = ["setuptools >= 64.0"]
build-backend = "setuptools.build_meta"

[project]
authors = [
    {name = "PRIMO team", email = "primo@netl.doe.gov"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Natural Language :: English",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Unix",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
description = "PRIMO - The P&A Project Optimizer"
dependencies = [
    "appengine-python-standard==1.1.10",
    "censusgeocode==0.5.2",
    "folium==0.20.0",
    "geopandas==1.1.1; python_version>= '3.10'",
    "geopandas==1.0.1; python_version == '3.9'",
    "highspy==1.9.0",
    "haversine==2.9.0",
    "ipyfilechooser==0.6.0",
    "ipyleaflet==0.20.0",
    "ipywidgets==8.1.7",
    "k-means-constrained==0.9.0",
    "matplotlib==3.9.4; python_version == '3.9'",
    "matplotlib==3.10.5; python_version >= '3.10'",
    "networkx==3.2.1; python_version == '3.9'",
    "networkx==3.4.2; python_version == '3.10'",
    "networkx==3.5; python_version >= '3.11'",
    "notebook==6.5.7",
    "numpy==2.0.2; python_version == '3.9'",
    "numpy==2.2.6; python_version == '3.10'",
    "numpy==2.3.2; python_version >= '3.11'",
    "openpyxl==3.1.5",
    "pandas==2.3.1",
    "pyarrow==21.0.0",
    "pyomo==6.10.1",
    "python-dotenv==1.1.1",
    "rasterio==1.4.3",
    "routingpy==1.3.0",
    "scikit-learn==1.6.1; python_version == '3.9'",
    "scikit-learn==1.7.1; python_version >= '3.10'",
    "xlsxwriter==3.2.5",
]
dynamic = ["version"]
keywords = [
    "PRIMO",
    "optimization",
    "process modeling",
    "operations research",
    "well plugging",
]
license = {file = "LICENSE.md"}
maintainers = [
    {name = "PRIMO team", email = "primo@netl.doe.gov"}
]
name = "primo-optimizer"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.9, <3.14"

[project.optional-dependencies]
dev = [
    "addheader==0.3.2",
    "black==25.1.0",
    "isort==6.0.1",
    "linkify-it-py==2.0.3",
    "myst-parser==3.0.1; python_version == '3.9'",
    "myst-parser==4.0.1; python_version >= '3.10'",
    "nbsphinx==0.9.7",
    "pre-commit==4.2.0",
    "pylint==3.3.7",
    "sphinx==7.4.7; python_version == '3.9'",
    "sphinx==8.1.3; python_version >= '3.10'",
    "sphinxcontrib-spelling==8.0.0; python_version == '3.9'",
    "sphinxcontrib-spelling==8.0.1; python_version >= '3.10'",
    "sphinx-rtd-theme==3.0.2",
]

test = [
    "pytest",
    "pytest-cov",
]

gurobi = [
    "gurobipy"
]
[project.scripts]
stagedfright = "stagedfright:main"

[project.urls]
Documentation = "https://primo.readthedocs.io/en/latest/"
Download = "https://github.com/PRIMO-optimizer/primo-codebase/releases"
Homepage = "https://edx.netl.doe.gov/nemri/"
Source = "https://github.com/PRIMO-optimizer/primo-codebase"
Tracker = "https://github.com/PRIMO-optimizer/primo-codebase/issues"

[tool.isort]
import_heading_firstparty = "User-defined libs"
import_heading_stdlib = "Standard libs"
import_heading_thirdparty = "Installed libs"
profile = "black"
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
src_paths = ["primo"]

[tool.setuptools]
platforms = ["windows", "linux"]
py-modules = ["stagedfright"]

[tool.setuptools.dynamic]
version = {attr = "primo.RELEASE"}

[tool.setuptools.packages.find]
#where = [".", ".stagedfright"]
include = ["primo*"]

[tool.setuptools.package-data]
"*" = ["*.xlsx"]